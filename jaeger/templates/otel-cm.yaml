apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel.fullname" . }}
data:
  otel-collector-config.yml: |
    receivers:
      jaeger:
        protocols:
          thrift_http:
            endpoint: "0.0.0.0:14278"
      otlp:
        protocols:
          grpc:
            endpoint: "localhost:65535"
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      otlp:
        endpoint: "jaeger:14250"
        tls:
          insecure: true
    processors:
      batch: {}
    service:
      pipelines:
        traces:
          receivers: [jaeger]
          processors: [batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
